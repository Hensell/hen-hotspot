name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore tests/HenHotspot.Tests.csproj --locked-mode
      - name: Check application formatting
        run: dotnet format whitespace src/HenHotspot.csproj --verify-no-changes --no-restore
      - name: Check test formatting
        run: dotnet format whitespace tests/HenHotspot.Tests.csproj --verify-no-changes --no-restore
      - name: Build without warnings
        run: dotnet build tests/HenHotspot.Tests.csproj -c Release --no-restore -warnaserror
      - name: Run offline tests
        run: dotnet run --project tests/HenHotspot.Tests.csproj -c Release --no-build
      - name: Verify a self-contained build
        run: dotnet publish src/HenHotspot.csproj -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -o work/publish
